[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rebase"
version = "0.7.0"
description = "Compatibility package for rebase-toolkit"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "rebase.energy" },
]
dependencies = [
    "rebase-toolkit==0.7.0",
]

[project.urls]
Homepage = "https://github.com/rebase-energy/rebase-toolkit"
Repository = "https://github.com/rebase-energy/rebase-toolkit"

[project.optional-dependencies]
data = [
    "rebase-toolkit[data]==0.7.0",
]
huggingface = [
    "rebase-toolkit[huggingface]==0.7.0",
]
modeling = [
    "rebase-toolkit[modeling]==0.7.0",
]
hillclimb = [
    "rebase-toolkit[hillclimb]==0.7.0",
]
snowflake = [
    "rebase-toolkit[snowflake]==0.7.0",
]
databricks = [
    "rebase-toolkit[databricks]==0.7.0",
]
bigquery = [
    "rebase-toolkit[bigquery]==0.7.0",
]
fabric = [
    "rebase-toolkit[fabric]==0.7.0",
]
sources = [
    "rebase-toolkit[sources]==0.7.0",
]
all = [
    "rebase-toolkit[all]==0.7.0",
]

[tool.setuptools]
packages = []
