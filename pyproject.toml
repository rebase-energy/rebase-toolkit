[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rebase-toolkit"
version = "0.2.0"
description = "Python client and toolkit for the Rebase Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "rebase.energy" },
]
dependencies = [
    "click>=8.4.1",
    "requests>=2.32.0",
    "rich>=15.0.0",
    "textual>=8.2.7",
    "typer>=0.25.1",
]

[project.urls]
Homepage = "https://github.com/rebase-energy/rebase-toolkit"
Repository = "https://github.com/rebase-energy/rebase-toolkit"

[project.scripts]
rebase = "rebase.cli:main"

[project.optional-dependencies]
data = [
    "energydatamodel",
]
huggingface = [
    "huggingface-hub>=1.20.1",
]
modeling = [
    "emflow",
]
hillclimb = [
    "rebase-hillclimb[emflow]",
    "google-cloud-storage>=2.14",
]
all = [
    "emflow",
    "energydatamodel",
    "huggingface-hub>=1.20.1",
]

[dependency-groups]
dev = [
    "pillow>=12.2.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "ty>=0.0.1a19",
]

[tool.hatch.build.targets.wheel]
packages = ["rebase"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
